name: Deploy to Scaleway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CONTAINER_NAME: velib-mcp
  SCALEWAY_REGISTRY: rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}
  SCALEWAY_CONTAINER_NAME: velib-mcp
  SCALEWAY_REGION: fr-par

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install Scaleway CLI
        run: |
          curl -o /tmp/scw -L "https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_$(uname -s)_$(uname -m)"
          sudo install -m 755 /tmp/scw /usr/local/bin/scw
          scw version

      - name: Configure Scaleway CLI
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCALEWAY_REGION }}
        run: |
          mkdir -p ~/.config/scw
          cat > ~/.config/scw/config.yaml <<EOF
          access_key: $SCW_ACCESS_KEY
          secret_key: $SCW_SECRET_KEY
          default_organization_id: $SCW_DEFAULT_ORGANIZATION_ID
          default_project_id: $SCW_DEFAULT_PROJECT_ID
          default_region: $SCW_DEFAULT_REGION
          default_zone: ${SCW_DEFAULT_REGION}-1
          EOF
          scw container container list || echo "Scaleway CLI configured"

      - name: Build container with Nix
        run: |
          nix build .#container --print-build-logs --accept-flake-config

      - name: Load container into podman
        run: |
          CONTAINER_PATH=$(nix path-info .#container)
          skopeo copy "docker-archive:$CONTAINER_PATH" "containers-storage:$CONTAINER_NAME:latest"

      - name: Run container checks
        run: |
          chmod +x ./container_checks.sh
          ./container_checks.sh

      - name: Login to Scaleway Container Registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          echo "$SCW_SECRET_KEY" | podman login $SCALEWAY_REGISTRY -u nologin --password-stdin

      - name: Tag and push container
        run: |
          podman tag $CONTAINER_NAME:latest $SCALEWAY_REGISTRY/$CONTAINER_NAME:latest
          podman push $SCALEWAY_REGISTRY/$CONTAINER_NAME:latest

      - name: Deploy to Scaleway
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCALEWAY_REGION }}
        run: |
          CONTAINER_ID=$(scw container container list -o json | jq -r "first(.[] | select(.name==\"$SCALEWAY_CONTAINER_NAME\")) | .id")

          if [ -z "$CONTAINER_ID" ] || [ "$CONTAINER_ID" = "null" ]; then
            echo "ERROR: Could not find Scaleway container named '$SCALEWAY_CONTAINER_NAME'"
            exit 1
          fi

          echo "Found container ID: $CONTAINER_ID"
          scw container container deploy "$CONTAINER_ID"

      - name: Verify deployment
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCALEWAY_REGION }}
        run: |
          sleep 30
          CONTAINER_ID=$(scw container container list -o json | jq -r "first(.[] | select(.name==\"$SCALEWAY_CONTAINER_NAME\")) | .id")
          STATUS=$(scw container container get "$CONTAINER_ID" -o json | jq -r '.status')
          echo "Deployment status: $STATUS"
          if [ "$STATUS" = "ready" ] || [ "$STATUS" = "created" ]; then
            echo "Deployment completed successfully"
          else
            echo "Deployment status: $STATUS (may still be deploying)"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Container**: $CONTAINER_NAME:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: $SCALEWAY_REGISTRY" >> $GITHUB_STEP_SUMMARY
          echo "- **Container name**: $SCALEWAY_CONTAINER_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: $SCALEWAY_REGION" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment triggered from commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
