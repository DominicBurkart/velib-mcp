[package]
name = "velib-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dominicburkart/velib-mcp"
description = "MCP server for Velib Paris bike sharing data"
keywords = ["mcp", "velib", "paris", "bike-sharing", "transport"]
categories = ["api-bindings", "web-programming"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
cargo-husky = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
